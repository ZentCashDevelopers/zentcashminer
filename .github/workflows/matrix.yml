name: Build
on:
    push:
      branches:
        - dev
    pull_request:
    release:
        types: [published]

env:
  TAG: ${{ github.ref }}

jobs:
  # Common Build matrix for builds on Ubuntu VM
  ubuntu_build:
    name: ${{ matrix.build_name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Add more compilers here if you need them
        build_name: ['Ubuntu GCC 9', 'Ubuntu GCC 10', 'Ubuntu Clang 11', 'aarch64']
        include:
          - build_name: 'Ubuntu GCC 9'
            package_name: 'gcc-9 g++-9'
            cc: gcc-9
            cxx: g++-9
            label: linux-gcc-9
            deployable: false
          - build_name: 'Ubuntu GCC 10'
            package_name: 'gcc-10 g++-10'
            cc: gcc-10
            cxx: g++-10
            label: linux
            deployable: true
          - build_name: 'Ubuntu Clang 11'
            package_name: 'clang-11'
            cc: clang-11
            cxx: clang++-11
            label: linux-clang-11
            deployable: false
          - build_name: 'aarch64'
            label: aarch64
            deployable: true
    env:
      LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch submodules
        run: git submodule update --init --recursive
        
      - name: Install CUDA
        if: matrix.build_name != 'aarch64'
        uses: Jimver/cuda-toolkit@v0.2.21
        id: cuda-toolkit
        with:
          cuda: '11.7.0'
          log-file-suffix: '${{matrix.build_name}}.txt'
          
      - name: Install Dependencies
        if: matrix.build_name != 'aarch64'
        run: |
          echo "Installed cuda version is: ${{steps.cuda-toolkit.outputs.cuda}}"
          echo "Cuda install location: ${{steps.cuda-toolkit.outputs.CUDA_PATH}}"
          nvcc -V
      
      - name: Install Dependencies
        if: matrix.build_name != 'aarch64'
        run: |
          sudo apt update
          sudo apt install -y libboost-all-dev libssl-dev ${{ matrix.package_name }}

      - name: Configure
        if: matrix.build_name != 'aarch64'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CUDA_HOME: '/usr/local/cuda/'
          CUDACXX: '/usr/local/cuda/bin/nvcc'
        run: |
          mkdir build && cd build
          cmake -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc -DCMAKE_BUILD_TYPE=Release -DSTATIC=true ..

      - name: Build
        if: matrix.build_name != 'aarch64'
        run: |
          cd build
          make -j2

      - name: Prepare and Build (aarch64)
        if: matrix.build_name == 'aarch64'
        run: |
          source scripts/prep-aarch64.sh
          mkdir build && cd build
          cmake -DENABLE_NVIDIA=OFF ..
          make -j2

      - name: Test Crypto
        if: matrix.build_name != 'aarch64'
        run: |
          cd build/
          ./argon2-cpp-test
              
      - name: Prepare for Deploy
        id: before_deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${TAG:5:4}" == "tags" ]]; then export TAG=${TAG:10}; else export TAG=${COMMIT_SHA}; fi
          cd build
          if [[ "${LABEL}" != "aarch64" ]]; then strip zentcashminer; fi
          rm -rf zentcashminer-cuda-11-${LABEL}-${TAG}
          mkdir zentcashminer-cuda-11-${LABEL}-${TAG}
          cp -r zentcashminer ../README.md zentcashminer-cuda-11-${LABEL}-${TAG}/
          tar cvfz zentcashminer-cuda-11-${LABEL}-${TAG}.tar.gz zentcashminer-cuda-11-${LABEL}-${TAG}
          ls
          pwd
          echo ::set-output name=file_name::zentcashminer-cuda-11-${LABEL}-${TAG}.tar.gz
          echo ::set-output name=binary_name::zentcashminer-cuda-11-${LABEL}-${TAG}

      - name: Upload to GH Release
        if: github.event_name == 'release' && github.repository == 'ZentCashDevelopers/zentcashminer' && matrix.deployable
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/${{ steps.before_deploy.outputs.file_name }}
          asset_name: ${{ steps.before_deploy.outputs.file_name }}
          asset_content_type: application/gzip

      # Upload to GH Actions Artifacts
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.before_deploy.outputs.binary_name }}
          path: ./build/${{ steps.before_deploy.outputs.binary_name }}

  # Mac builds on Catalina VM
  macos_build:
    name: macOS
    runs-on: macOS-13
    env:
      CC: /usr/local/opt/llvm@8/bin/clang
      CXX: /usr/local/opt/llvm@8/bin/clang++
      LABEL: osx
    steps:
      - uses: actions/checkout@v2

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - name: Dependencies
        run: |
          brew install --force boost llvm@11
          ln -s /usr/local/opt/openssl/include/openssl /usr/local/include

      - name: Configure
        run: |
          mkdir build && cd build
          cmake -DENABLE_NVIDIA=OFF ..

      - name: Build
        run: |
          cd build
          make -j2

      - name: Test Crypto
        if: matrix.build_name != 'aarch64'
        run: |
          cd build
          ./argon2-cpp-test

      - name: Prepare for Deploy
        id: before_deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${TAG:5:4}" == "tags" ]]; then export TAG=${TAG:10}; else export TAG=${COMMIT_SHA}; fi
          cd build
          if [[ "${LABEL}" != "aarch64" ]]; then strip zentcashminer; fi
          rm -rf zentcashminer-cuda-10-${LABEL}-${TAG}
          mkdir zentcashminer-cuda-10-${LABEL}-${TAG}
          cp -r zentcashminer ../README.md zentcashminer-cuda-10-${LABEL}-${TAG}
          tar cvfz zentcashminer-cuda-10-${LABEL}-${TAG}.tar.gz zentcashminer-cuda-10-${LABEL}-${TAG}
          pwd
          ls
          echo ::set-output name=file_name::zentcashminer-cuda-10-${LABEL}-${TAG}.tar.gz
          echo ::set-output name=binary_name::zentcashminer-cuda-10-${LABEL}-${TAG}

      - name: Upload to GH Release
        if: github.event_name == 'release' && github.repository == 'ZentCashDevelopers/zentcashminer'
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/${{ steps.before_deploy.outputs.file_name }}
          asset_name: ${{ steps.before_deploy.outputs.file_name }}
          asset_content_type: application/gzip

      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.before_deploy.outputs.binary_name }}
          path: ./build/${{ steps.before_deploy.outputs.binary_name }}

  windows_build:
    name: Windows
    runs-on: windows-latest
    env:
      LABEL: windows
    steps:
      - uses: actions/checkout@v2

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - name: Install CUDA
        if: steps.cache.outputs.cache-hit != 'true'
        run: choco install cuda --version=10.2.89.20191206 -y

      - name: Reload environment variables
        shell: powershell
        run: |
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')
          Write-Output "PATH is now: $env:Path"

      - name: Install OpenSSL
        run: choco install openssl

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Compile
        run: |         
          copy 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v10.2\extras\visual_studio_integration\MSBuildExtensions\*' 'C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Microsoft\VC\v160\BuildCustomizations'
          ./scripts/win-install.bat

      - name: Prepare for Deploy
        shell: bash
        id: before_deploy
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${TAG:5:4}" == "tags" ]]; then export TAG=${TAG:10}; else export TAG=${COMMIT_SHA}; fi
          cd build
          cd Release
          rm -rf zentcashminer-cuda-10-${LABEL}-${TAG}
          mkdir zentcashminer-cuda-10-${LABEL}-${TAG}
          cp -r zentcashminer.exe ../../README.md zentcashminer-cuda-10-${LABEL}-${TAG}
          7z a zentcashminer-cuda-10-${LABEL}-${TAG}.zip zentcashminer-cuda-10-${LABEL}-${TAG}
          echo ::set-output name=file_name::zentcashminer-cuda-10-${LABEL}-${TAG}.zip
          echo ::set-output name=binary_name::zentcashminer-cuda-10-${LABEL}-${TAG}

      - name: Upload to GH Release
        if: github.event_name == 'release' && github.repository == 'ZentCashDevelopers/zentcashminer'
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./build/Release/${{ steps.before_deploy.outputs.file_name }}
          asset_name: ${{ steps.before_deploy.outputs.file_name }}
          asset_content_type: application/zip

      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.before_deploy.outputs.binary_name }}
          path: ./build/Release/${{ steps.before_deploy.outputs.binary_name }}
